<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" 
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" 
          crossorigin="anonymous">
    <style>
        .text-white{
            color:white;
        }
        .card {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .card img {
            max-height: 200px;
            width: auto;
            margin-bottom: 10px;
        }
        .recommendation-row {
            margin-top: 30px;
        }
    </style>
</head>
<body style="background-color:black">

    <nav class="navbar" style="background-color:#00a65a">
        <a class="navbar-brand">My Book Recommender</a>
        <ul class="nav navbar-nav">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            <li><a>Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-white" style="font-size:50px">Recommend Books</h1>
                <form action="/recommend_books" method="post">
                    <input name="user_input" type="text" class="form-control" placeholder="Type a book title"><br>
                    <input type="submit" class="btn btn-lg btn-warning">
                </form>
            </div>
        </div>

        {% if message %}
            <div class="row">
                <div class="col-md-12">
                    <p class="text-white text-center" style="margin-top:30px;">{{ message }}</p>
                </div>
            </div>
        {% endif %}

        {% if data %}
            <div class="row recommendation-row">
                {% for i in data %}
                    <div class="col-md-3 col-sm-6" style="margin-top:30px">
                        <div class="card">
                            <img class="card-img-top" src="{{ i[2] }}" alt="{{ i[0] }}">
                            <p class="text-white"><strong>{{ i[0] }}</strong></p>
                            <h4 class="text-white">{{ i[1] }}</h4>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

    </div>
</body>
</html>
